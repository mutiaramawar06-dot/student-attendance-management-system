version: '3.8'

services:
  # 1. Student Database (PostgreSQL)
  student-db:
    image: postgres:15-alpine
    container_name: student-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: student_db
    ports:
      - "5432:5432"
    volumes:
      - student_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sim-network

  # 2. Student Management System API (FastAPI)
  student-api:
    build:
      context: ./student-backend
      dockerfile: Dockerfile
    container_name: student-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@student-db:5432/student_db
      - SECRET_KEY=student_jwt_secret_key_cloud_computing_2026
    depends_on:
      student-db:
        condition: service_healthy
    networks:
      - sim-network

  # 3. Attendance Database (MySQL 8)
  attendance-db:
    image: mysql:8.0
    container_name: attendance-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: attendance_db
    ports:
      - "3306:3306"
    volumes:
      - attendance_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - sim-network

  # 4. Attendance Management System API (Spring Boot)
  attendance-api:
    build:
      context: ./attendance-backend
      dockerfile: Dockerfile
    container_name: attendance-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://attendance-db:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - DB_DIALECT=org.hibernate.dialect.MySQLDialect
    depends_on:
      attendance-db:
        condition: service_healthy
    networks:
      - sim-network

  # 5. Integrated React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_STUDENT_API_URL=http://localhost:8000
        - VITE_ATTENDANCE_API_URL=http://localhost:8080
    container_name: react-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - student-api
      - attendance-api
    networks:
      - sim-network

networks:
  sim-network:
    driver: bridge

volumes:
  student_postgres_data:
  attendance_mysql_data:
